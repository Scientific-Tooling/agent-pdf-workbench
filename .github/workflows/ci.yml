name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    name: Python tests (unit + integration)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        # mcp is installed so the MCP tool tests run instead of skipping.
        run: pip install -e '.[mcp,dev]'

      - name: Lint Python
        run: python3 -m ruff check src tests

      - name: Run unit tests
        run: |
          PYTHONPATH=src python3 -m unittest discover \
            -s tests/unit -p 'test_*.py' -v

      - name: Run integration tests
        run: |
          PYTHONPATH=src python3 -m unittest discover \
            -s tests/integration -p 'test_*.py' -v

  frontend-checks:
    name: Frontend checks (typecheck + lint + unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Frontend unit tests
        run: npm run test:unit

      - name: Build frontend assets
        run: npm run build:frontend

  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    needs: [python-tests, frontend-checks]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python package
        run: pip install -e '.[mcp]'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build frontend assets
        run: npm run build:frontend

      - name: Run E2E tests
        run: npm run test:e2e
